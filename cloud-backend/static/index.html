<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AutoResume Cloud</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0f172a; color: #e2e8f0; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .card { background: linear-gradient(180deg, rgba(30,41,59,.75), rgba(15,23,42,.9)); border: 1px solid rgba(148,163,184,.1); border-radius: 16px; }
  .btn-primary { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; border-radius: 12px; background: linear-gradient(to right, #0284c7, #0ea5e9); color: #fff; font-size: 16px; font-weight: 600; border: none; cursor: pointer; box-shadow: 0 8px 24px rgba(14,165,233,.3); transition: all .2s; }
  .btn-primary:hover { filter: brightness(1.15); transform: translateY(-1px); }
  .btn-ghost { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; border-radius: 12px; background: transparent; color: #94a3b8; font-size: 16px; border: 1px solid #334155; cursor: pointer; transition: all .2s; }
  .btn-ghost:hover { color: #e2e8f0; border-color: #475569; }
  .endpoint { background: #0b1220; border: 1px solid #1e293b; border-radius: 8px; padding: 10px 14px; font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; color: #94a3b8; }
  .method { color: #38bdf8; font-weight: 600; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="max-w-xl w-full">
    <!-- Logo -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-brand-500 to-purple-500 flex items-center justify-center mb-4 shadow-xl" style="background: linear-gradient(135deg, #0ea5e9, #8b5cf6);">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
      </div>
      <h1 class="text-3xl font-bold">AutoResume Cloud</h1>
      <p class="text-slate-500 mt-2 text-center">云端管控服务 · 用户认证 · 版本推送</p>
    </div>

    <!-- Status -->
    <div class="card p-6 mb-6">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></div>
        <span class="text-sm font-medium">服务运行中</span>
      </div>

      <div class="space-y-3">
        <div class="endpoint"><span class="method">GET</span> /health — 健康检查</div>
        <div class="endpoint"><span class="method">GET</span> /admin — 管理后台</div>
        <div class="endpoint"><span class="method">POST</span> /auth/login — 客户端登录</div>
        <div class="endpoint"><span class="method">GET</span> /client/latest-release — 版本查询</div>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-center gap-4">
      <a href="/admin" class="btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        进入管理后台
      </a>
      <a href="/docs" class="btn-ghost">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        API 文档
      </a>
    </div>

    <p class="text-center text-xs text-slate-600 mt-8">
      AutoResume Cloud v0.1.0 · 管理后台仅管理员可操作，客户端 API 需登录
    </p>
  </div>
</body>
</html>
